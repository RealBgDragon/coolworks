name: Deploy to SFTP Server

on:
    push:
        branches:
            - main

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.2" # Set your PHP version here
                  extensions: mbstring, intl, xml
                  tools: composer

            - name: Install Composer dependencies
              run: composer install --no-interaction --prefer-dist --optimize-autoloader

            - name: Install SSH client
              run: sudo apt-get update && sudo apt-get install -y openssh-client

            - name: Transfer files via SFTP
              env:
                  SFTP_PRIVATE_KEY: ${{ secrets.SFTP_PRIVATE_KEY }}
              run: |
                  mkdir -p ~/.ssh
                  echo "$SFTP_PRIVATE_KEY" > ~/.ssh/id_rsa
                  chmod 600 ~/.ssh/id_rsa
                  ssh-keyscan -p 20180 srv.bgdragon.com >> ~/.ssh/authorized_keys
                  sftp -P 20180 -i ~/.ssh/id_rsa user@srv.bgdragon.com <<EOF
                  put -r * /var/www/bgdrag0n/www/bgdragon.com
                  bye
                  EOF
